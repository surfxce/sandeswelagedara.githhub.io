<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test SB: Sandes' Battery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F1EFE9; --sand:#E8E2D5; --blush:#DBC5B8; --sky:#B6C9D1; --sage:#A6AA95;
  --mustard:#C3891B; --terra:#C2664A; --olive:#5C6343; --teal:#3C5D6A;
  --ink:#25261F; --muted:#6E6D62; --line:rgba(37,38,31,.10);
  --head:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.8,.25,1); --t:280ms;
  --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);font-weight:500;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--teal)}
::selection{background:var(--sky)}

/* background wash */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vw 40vh at 8% 0%, rgba(182,201,209,.35), transparent 70%),
    radial-gradient(50vw 40vh at 100% 100%, rgba(219,197,184,.45), transparent 70%),
    var(--cream)}

#top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:10;
  background:linear-gradient(var(--cream),rgba(241,239,233,0));pointer-events:none}
#top > *{pointer-events:auto}
.brand{font-family:var(--head);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--olive)}
.brand small{display:block;letter-spacing:.06em;text-transform:none;font-weight:400;color:var(--muted);font-size:11px}
.chip{font-family:var(--head);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--sand);color:var(--olive)}
.chip.teal{background:var(--teal);color:#fff}
.chip.terra{background:var(--terra);color:#fff}
.chip.mustard{background:var(--mustard);color:#fff}
.chip.sage{background:var(--sage);color:#fff}

#bar{position:fixed;top:0;left:0;right:0;height:4px;background:transparent;z-index:11}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--mustard));transition:width 500ms var(--ease)}

#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:96px 20px 64px}
.stage{width:100%;max-width:760px}

/* card */
.card{background:var(--sand);border-radius:var(--r);padding:44px 48px;box-shadow:0 30px 60px -40px rgba(37,38,31,.35), 0 1px 0 rgba(255,255,255,.6) inset;position:relative;overflow:hidden}
.card.q{touch-action:pan-y;user-select:none;cursor:grab}
.card.q:active{cursor:grabbing}
@media (max-width:600px){.card{padding:30px 24px}}

.eyebrow{font-family:var(--head);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:14px;display:flex;gap:12px;align-items:center}
.eyebrow .n{color:var(--muted);letter-spacing:.08em}
.window{font-style:italic;color:var(--muted);font-size:15px;margin-bottom:8px}
.qtext{font-family:var(--head);font-size:clamp(22px,3vw,30px);line-height:1.25;font-weight:400;margin:6px 0 30px}
.qtext strong{font-weight:600}

/* option rows */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.55);border:1.5px solid transparent;
  transition:transform var(--t) var(--ease),background var(--t),border-color var(--t),box-shadow var(--t);position:relative;overflow:hidden}
.opt:hover{background:#fff;transform:translateX(4px);border-color:var(--sky)}
.opt .k{font-family:var(--head);font-size:11px;letter-spacing:.1em;width:24px;height:24px;border-radius:8px;background:var(--cream);display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.sel .k{background:rgba(255,255,255,.2);color:#fff}
.opt.first{background:var(--terra);color:#fff;border-color:var(--terra)}
.opt.first .k{background:rgba(255,255,255,.2);color:#fff}
.opt.pulse::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5);animation:pulse 420ms var(--ease) forwards}
@keyframes pulse{from{opacity:.9;transform:scaleX(0);transform-origin:left}to{opacity:0;transform:scaleX(1)}}
.opts.row{flex-direction:row;flex-wrap:nowrap}
.opts.row .opt{flex:1 1 0;min-width:0;justify-content:center;text-align:center;flex-direction:column;gap:6px;padding:16px 6px;font-size:15px}
.opts.row .opt:hover{transform:translateY(-3px)}
.opts.row .opt .k{width:auto;padding:0 8px}
.scale{display:flex;gap:6px;justify-content:space-between}
.scale .opt{padding:14px 0;justify-content:center;min-width:0;flex:1;font-family:var(--head)}
.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.hint{color:var(--muted);font-size:14px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint .swipe{display:inline-flex;align-items:center;gap:8px}
.hint .swipe i{display:inline-block;width:26px;height:2px;background:var(--sage);position:relative;border-radius:2px}
.hint .swipe i::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border-top:2px solid var(--sage);border-right:2px solid var(--sage);transform:rotate(45deg)}
.link{background:none;color:var(--teal);text-decoration:underline;text-underline-offset:3px;padding:0}
.link:hover{color:var(--terra)}

/* examples */
.opt small{display:block;font-size:11.5px;line-height:1.3;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:0}
.opts.row .opt small{margin-top:-2px}
.opt .ol{display:flex;flex-direction:column;gap:2px}
.opt .ol small{font-size:12.5px}
.opt .tag{margin-left:auto;font-size:11px;letter-spacing:.14em;opacity:.85;font-family:var(--head);flex:none}
.opt.sel small,.opt.first small{color:rgba(255,255,255,.75)}
.ex{margin-top:16px;padding:12px 16px;border-left:3px solid var(--sky);color:var(--muted);font-size:14.5px;line-height:1.45;min-height:3.2em;border-radius:0 12px 12px 0;background:rgba(255,255,255,.35);transition:background var(--t),border-color var(--t),color var(--t)}
.ex.hot{background:rgba(255,255,255,.7);border-color:var(--terra);color:var(--ink)}
.ex b{color:var(--terra);font-weight:600;font-family:var(--head)}
@media (hover:none){.ex{min-height:0}}

/* note drawer */
.note{max-height:0;overflow:hidden;transition:max-height 360ms var(--ease),margin var(--t)}
.note.open{max-height:260px;margin-top:20px}
.note textarea{width:100%;min-height:110px;border:1.5px solid var(--sky);border-radius:14px;padding:14px 16px;font:inherit;font-size:15px;background:#fff;resize:vertical;outline:none;transition:border-color var(--t)}
.note textarea:focus{border-color:var(--teal)}
.note label{display:block;font-family:var(--head);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);margin-bottom:8px}
.card.has-note .qtext::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--terra);margin-left:10px;vertical-align:middle}

/* buttons */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;align-items:center}
.btn{font-family:var(--head);font-weight:500;letter-spacing:.04em;padding:14px 26px;border-radius:999px;background:var(--terra);color:#fff;transition:transform var(--t) var(--ease),box-shadow var(--t),background var(--t)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--terra)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;color:var(--olive);border:1.5px solid var(--sage)}
.btn.ghost:hover{box-shadow:none;background:rgba(255,255,255,.5)}
.btn.teal{background:var(--teal)}
.btn.teal:hover{box-shadow:0 14px 30px -14px var(--teal)}
.btn.sm{padding:9px 16px;font-size:14px}

/* welcome */
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:300;line-height:1;letter-spacing:-.02em}
.hero h1 b{font-weight:600;display:block}
.hero p.lead{font-size:19px;color:var(--muted);max-width:56ch;margin:22px 0 0}
.swatches{display:flex;gap:6px;margin:26px 0 30px}
.swatches i{height:8px;flex:1;border-radius:4px;box-shadow:0 0 0 1px rgba(37,38,31,.08) inset;transform-origin:left;animation:grow 700ms var(--ease) both}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:26px}
.mod{background:rgba(255,255,255,.55);border-radius:14px;padding:14px 16px;animation:rise 500ms var(--ease) both}
.mod b{font-family:var(--head);font-weight:500;display:block}
.mod span{color:var(--muted);font-size:14px}
.mod.done{background:var(--olive);color:#fff}
.mod.done span{color:rgba(255,255,255,.75)}

/* intro */
.intro h2{font-size:clamp(34px,5vw,52px);font-weight:300;letter-spacing:-.02em;line-height:1.05}
.intro p{font-size:18px;color:var(--muted);max-width:60ch;margin:18px 0 0}
.intro em{color:var(--terra);font-style:normal}
.intro strong{color:var(--ink)}
.count{font-family:var(--head);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin-top:26px}

/* values */
.vcard{text-align:center;padding:60px 48px}
.vcard h2{font-size:clamp(36px,6vw,56px);font-weight:300;letter-spacing:-.02em}
.vcard p{color:var(--muted);font-size:18px;max-width:44ch;margin:12px auto 34px}
.buckets{display:flex;flex-direction:row;gap:10px;justify-content:center}
@media (max-width:520px){.buckets{flex-direction:column}}
.buckets .opt{flex:1;justify-content:center;flex-direction:column;gap:4px;padding:18px 10px;font-family:var(--head)}
.buckets .opt.b0{background:rgba(92,99,67,.12)} .buckets .opt.b1{background:rgba(182,201,209,.4)} .buckets .opt.b2{background:rgba(255,255,255,.55)}
.buckets .opt:hover{transform:translateY(-3px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.vchip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.6);font-family:var(--head);font-size:15px;transition:all var(--t) var(--ease);border:1.5px solid transparent}
.vchip:hover{border-color:var(--sky);transform:translateY(-2px)}
.vchip.on{background:var(--teal);color:#fff}
.vchip.dim{opacity:.35;pointer-events:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:10px}
.vs .opt{flex-direction:column;align-items:flex-start;gap:6px;padding:26px 24px;min-height:160px;justify-content:center}
.vs .opt b{font-family:var(--head);font-size:24px;font-weight:500}
.vs .opt span{color:var(--muted);font-size:14px}
.vs .opt:hover span{color:var(--ink)}
.vs .or{display:grid;place-items:center;font-family:var(--head);letter-spacing:.2em;font-size:12px;color:var(--muted)}
.gaprow{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.gaprow .rk{font-family:var(--head);color:var(--mustard);font-size:20px}
.gaprow b{font-family:var(--head);font-weight:500}
.gaprow .scale{margin-top:8px}
.gaprow .scale .opt{padding:8px 0;font-size:14px;border-radius:9px}

/* results */
.res{display:flex;flex-direction:column;gap:18px}
.res .card{animation:rise 600ms var(--ease) both}
.res h2{font-size:clamp(24px,3vw,32px);font-weight:500;margin-bottom:6px}
.res h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin:26px 0 12px;font-weight:600}
.res p.sub{color:var(--muted);margin:0 0 6px;font-size:15px}
.arch h1{font-size:clamp(38px,7vw,74px);font-weight:300;letter-spacing:-.025em;line-height:1;margin:6px 0 0}
.arch h1 b{font-weight:600}
.arch .tail{font-family:var(--head);font-size:clamp(18px,2.5vw,26px);color:var(--terra);margin-top:6px;font-weight:400}
.arch ul{margin:18px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.sig{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.sig .chip{background:rgba(255,255,255,.6);color:var(--olive);text-transform:none;letter-spacing:0;font-size:14px;padding:8px 14px;font-family:var(--body)}
.bp{margin:14px 0}
.bp .lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px;font-family:var(--head);letter-spacing:.02em}
.bp .lbl b{color:var(--ink);font-weight:500}
.bp .track{height:12px;border-radius:6px;background:rgba(255,255,255,.7);position:relative}
.bp .track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--sage)}
.bp .dot{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--teal);border:3px solid var(--sand);transform:translateX(-50%);left:50%;transition:left 900ms var(--ease)}
.bp .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bp .meta .chip{font-size:10px;padding:4px 9px}
.ub{margin:9px 0}
.ub .lbl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.ub .lbl span{color:var(--muted);font-family:var(--head)}
.ub .track{height:10px;border-radius:5px;background:rgba(255,255,255,.7);overflow:hidden}
.ub .fill{height:100%;width:0;border-radius:5px;background:var(--teal);transition:width 900ms var(--ease)}
.ub.terra .fill{background:var(--terra)} .ub.mustard .fill{background:var(--mustard)} .ub.olive .fill{background:var(--olive)} .ub.sage .fill{background:var(--sage)} .ub.sky .fill{background:var(--sky)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.flag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blush);color:var(--ink);font-family:var(--head);letter-spacing:.04em}
.ins{display:grid;gap:12px}
.ins div{background:rgba(255,255,255,.55);border-radius:14px;padding:16px 18px;border-left:4px solid var(--mustard)}
.ins b{font-family:var(--head);font-weight:500;display:block;margin-bottom:4px;font-size:17px}
.ins p{margin:0;color:var(--muted);font-size:15px}
.lb{display:grid;gap:6px}
.lb div{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:var(--head);color:var(--mustard);font-size:18px}
.lb .lived{font-size:13px;color:var(--muted);font-family:var(--head)}
.lb .lived.gap{color:var(--terra);font-weight:600}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px}
.quad div{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.5);font-size:14px;color:var(--muted);text-align:center;font-family:var(--head)}
.quad div.on{background:var(--olive);color:#fff}
.stateline{font-size:14px;color:var(--muted);margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-family:var(--head);font-weight:500;color:var(--teal);padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{color:var(--muted)}
pre.prompt{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:#fff;border-radius:14px;padding:16px;max-height:340px;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-family:var(--head);font-size:14px;opacity:0;transition:all var(--t) var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
input.name{font:inherit;padding:12px 16px;border-radius:12px;border:1.5px solid var(--sky);background:#fff;outline:none;width:100%;max-width:320px}
input.name:focus{border-color:var(--teal)}

/* transitions */
.stage.in{animation:slidein 320ms var(--ease) both}
.stage.out{animation:slideout 200ms var(--ease) both}
.stage.back-in{animation:slideinL 320ms var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideinL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(-30px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reveal>*{animation:rise 520ms var(--ease) both}
.reveal>*:nth-child(1){animation-delay:40ms}.reveal>*:nth-child(2){animation-delay:110ms}.reveal>*:nth-child(3){animation-delay:180ms}.reveal>*:nth-child(4){animation-delay:250ms}.reveal>*:nth-child(5){animation-delay:320ms}.reveal>*:nth-child(6){animation-delay:390ms}.reveal>*:nth-child(7){animation-delay:460ms}.reveal>*:nth-child(8){animation-delay:530ms}
.opts>*{animation:rise 380ms var(--ease) both}
.opts>*:nth-child(2){animation-delay:40ms}.opts>*:nth-child(3){animation-delay:80ms}.opts>*:nth-child(4){animation-delay:120ms}.opts>*:nth-child(5){animation-delay:160ms}.opts>*:nth-child(6){animation-delay:200ms}.opts>*:nth-child(7){animation-delay:240ms}
.dragging{transition:none!important}
.stage.noanim *{animation:none!important}
@media (max-width:600px){
  .opts.row{flex-direction:column;flex-wrap:nowrap}
  .opts.row .opt{flex:none;flex-direction:row;justify-content:flex-start;text-align:left;padding:13px 16px;gap:12px;font-size:16px}
  .opts.row .opt .k{width:24px;padding:0}
  .hint .swipe span{display:none}
  .qtext{font-size:22px}
  .scale{flex-wrap:wrap;gap:5px}
  .scale .opt{flex:1 0 calc(100%/6 - 5px);padding:11px 0}
  .vs{grid-template-columns:1fr}
  .vs .or{padding:2px 0}
  .vs .opt{min-height:0;padding:18px 20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div class="brand">Test SB<small>Sandes' Battery</small></div><div id="topright"></div></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
