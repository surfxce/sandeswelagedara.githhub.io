<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>freaky website</title>
<style>
  :root{
    --bg:#0d0b14; --card:#1c1728; --card2:#231c33; --line:#332a47;
    --text:#efeaf7; --dim:#a79cbd; --faint:#6f6486; --accent:#c86dd7; --accent2:#ff7a9c; --warm:#ffb35c;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1000px 600px at 15% -10%, #3a1d55 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #5b1f3c 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    line-height:1.45; min-height:100vh; padding:24px 16px 140px;
  }
  .wrap{max-width:760px;margin:0 auto}
  em{font-style:italic}

  header{text-align:center;margin:10px 0 18px}
  h1{
    font-size:clamp(30px,7vw,52px);margin:0 0 8px;line-height:1.05;letter-spacing:-.02em;
    background:linear-gradient(92deg,var(--accent) 0%,var(--accent2) 60%,var(--warm) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--dim);font-size:13px;margin:0 auto}
  .grad{background:linear-gradient(92deg,var(--accent) 0%,var(--accent2) 60%,var(--warm) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

  .btn{
    display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:650;
    background:linear-gradient(92deg,var(--accent),var(--accent2));color:#160f1e;
    padding:13px 26px;border-radius:999px;font-size:16px;
    transition:transform .12s ease, filter .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost.danger{color:var(--accent2);border-color:#ff7a9c66}
  .btn.wide{display:block;width:100%}
  .btn.sm{padding:10px 16px;font-size:13.5px}
  .btn.quiet{background:#ffffff0d;border:1px solid var(--line);color:var(--text)}
  .linkbtn{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;cursor:pointer;padding:6px 4px}
  .linkbtn:hover{color:var(--text)}
  .linkbtn:disabled{opacity:.4;cursor:default}

  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;margin-bottom:18px;
  }
  .card h2{margin:0 0 12px;font-size:22px;letter-spacing:-.01em}
  .card h3{margin:0 0 10px;font-size:16px}
  .card p{color:var(--dim);font-size:14.5px;margin:0 0 12px}
  .card p:last-child{margin-bottom:0}
  .card p b{color:var(--text)}

  /* segmented control */
  .seg{display:flex;background:#ffffff0d;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 0 14px}
  .seg button{flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:13.5px;font-weight:600;padding:7px;border-radius:8px;cursor:pointer;transition:.12s}
  .seg button.on{background:#ffffff14;color:var(--text)}

  /* intro slides */
  .slide .emo{font-size:44px;line-height:1;margin-bottom:12px}
  .slide h2{font-size:26px;margin:0 0 14px}
  .slide p{margin:0 0 14px}
  .wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-bottom:9px}
  .wrow .wt{min-width:34px}
  .wrow .wt.hot{color:var(--accent2);border-color:#ff7a9c66}
  .demo{background:#ffffff0a;border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 0 14px}
  .demo .q{font-size:15px;margin:6px 0 8px}
  .ok{color:var(--accent2);font-weight:600;font-size:13.5px;margin-top:8px}
  .quote{display:flex;gap:12px;align-items:flex-start;background:#0d0b1466;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:#cfc4e0;margin:0 0 14px}
  .quote .hint{flex:0 0 auto;cursor:default;color:#160f1e;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .dots{display:flex;gap:7px;justify-content:center;margin:14px 0}
  .dots i{display:block;width:7px;height:7px;border-radius:999px;background:var(--line);transition:.2s}
  .dots i.on{width:22px;background:linear-gradient(92deg,var(--accent),var(--accent2))}
  .gate{color:var(--faint);font-size:13px;text-align:center;padding:15px 0}

  /* toggle cards */
  .toggle{
    display:flex;align-items:center;gap:13px;cursor:pointer;user-select:none;
    background:#ffb35c0f;border:1px solid #ffb35c33;border-radius:12px;padding:13px 15px;margin:0 0 14px;
  }
  .toggle:hover{background:#ffb35c17}
  .toggle.pink{background:#ff7a9c0f;border-color:#ff7a9c38}
  .toggle.pink:hover{background:#ff7a9c17}
  .sw{flex:0 0 auto;width:44px;height:25px;border-radius:999px;background:#ffffff1a;border:1px solid var(--line);padding:2px;transition:.16s}
  .sw i{display:block;width:19px;height:19px;border-radius:50%;background:#8d81a6;transition:.16s}
  .toggle.on .sw{background:linear-gradient(92deg,var(--accent),var(--accent2));border-color:transparent}
  .toggle.on .sw i{transform:translateX(19px);background:#160f1e}
  .toggle .tl{font-size:15px;font-weight:650}
  .toggle .td{font-size:12.5px;color:var(--dim);margin-top:1px}
  .agecard{background:#ff7a9c0f;border:1px solid #ff7a9c38;border-radius:12px;padding:13px 15px;margin:0 0 14px}
  .agecard .toggle{background:transparent;border:0;padding:0;margin:0}
  .agecard .toggle:hover{background:transparent}
  .agebody{margin-top:10px}
  .agerow{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
  .agerow .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .agerow .u{font-size:12.5px;color:var(--dim)}
  .agerow .f{margin-left:auto;font-size:12.5px;color:var(--accent2);font-variant-numeric:tabular-nums}
  .agecard .note{font-size:11.5px;color:var(--faint);margin-top:6px}

  input[type=range]{width:100%;margin:0;accent-color:var(--accent2);height:22px;cursor:grab;display:block}
  input[type=range]:active{cursor:grabbing}
  input[type=range].purple{accent-color:var(--accent)}

  /* quiz */
  .sechead{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
  .sechead .emo{font-size:30px;line-height:1}
  .sechead h2{margin:0;font-size:22px;letter-spacing:-.01em}
  .sechead .blurb{color:var(--dim);font-size:13.5px;margin-top:2px}
  .secmeta{color:var(--dim);font-size:12.5px;margin:10px 0 14px;border-top:1px solid var(--line);padding-top:10px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
  .topbar .t{font-size:14px;color:var(--dim);font-weight:600}
  .menu{position:relative}
  .menu .pop{
    position:absolute;right:0;top:36px;z-index:30;min-width:260px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 40px #00000088;
  }
  .menu .pop .mh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 8px 4px}
  .menu .pop button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:transparent;border:0;color:var(--text);font:inherit;font-size:13.5px;padding:8px;border-radius:8px;cursor:pointer}
  .menu .pop button:hover{background:#ffffff0d}
  .menu .pop button .chk{width:14px;color:var(--accent2);flex:0 0 auto}

  .defs{
    background:#c86dd714;border:1px solid #c86dd733;border-radius:12px;
    padding:12px 14px;margin:0 0 16px;font-size:13.5px;color:#d9cfe8;
  }
  .defs b{color:var(--text)}
  .defs .h{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:700}
  .defs p{margin:0 0 7px;color:#d9cfe8;font-size:13.5px}
  .defs p:last-child{margin-bottom:0}

  ul.items{list-style:none;margin:0;padding:0}
  li.item{border-radius:12px;border:1px solid transparent;margin-bottom:2px;transition:background .12s ease,border-color .12s ease}
  li.item:hover{background:#ffffff08}
  li.item.on{background:#ff7a9c14;border-color:#ff7a9c3d}
  .row{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;cursor:pointer}
  .qnum{flex:0 0 auto;width:26px;text-align:right;margin-top:3px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--faint);user-select:none}
  li.item.on .qnum{color:var(--accent2)}
  .meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:1px}
  .box{flex:0 0 auto;width:21px;height:21px;border-radius:7px;margin-top:1px;border:2px solid #6b5a8a;display:grid;place-items:center;transition:.12s ease}
  li.item.on .box{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .box svg{width:12px;height:12px;opacity:0;transition:.12s}
  li.item.on .box svg{opacity:1}
  .txt{flex:1;font-size:15px}
  .wt{
    font-size:11px;font-variant-numeric:tabular-nums;color:var(--dim);
    background:#ffffff0d;border:1px solid var(--line);border-radius:999px;
    padding:2px 8px;white-space:nowrap;min-width:32px;text-align:center;
  }
  li.item.on .wt{color:#ffd0dc;border-color:#ff7a9c40;background:#ff7a9c1a}

  .scaler{padding:2px 14px 15px 83px}
  .sq{font-size:12.5px;color:var(--dim);margin-bottom:8px}
  .slabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;margin-top:4px}
  .slabel .l{color:var(--text);font-weight:600}
  .slabel .w{color:var(--accent2);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
  .slabel .w.disc{color:var(--accent)}
  .slabel .w.full{color:var(--faint)}
  .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:2px}

  .hint{
    width:19px;height:19px;border-radius:50%;
    border:1px solid var(--line);background:#ffffff0d;color:var(--dim);
    font-size:11px;font-weight:700;line-height:1;display:grid;place-items:center;
    cursor:help;user-select:none;transition:.12s;
  }
  .hint:hover,.hint.pinned{color:#160f1e;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .hintbox{
    margin:-3px 14px 11px 83px;padding:10px 12px;font-size:13px;color:#cfc4e0;
    background:#0d0b1459;border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:9px;
  }

  .cheeky{margin:-2px 14px 13px 83px;padding:11px 13px;background:#ffb35c12;border:1px solid #ffb35c38;border-radius:10px}
  .cq{font-size:13.5px;color:#ffd7a5;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chip{border:1px solid var(--line);background:#ffffff0d;color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;transition:.12s}
  .chip:hover{border-color:#ffb35c66}
  .chip.sel{background:linear-gradient(92deg,var(--warm),var(--accent2));color:#160f1e;border-color:transparent;font-weight:650}
  .cinput{flex:1 1 150px;min-width:130px;background:#0d0b1459;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px}
  .cinput::placeholder{color:var(--faint)}
  .cinput:focus{outline:0;border-color:#ffb35c88}
  .dossier{background:#ffb35c0f;border:1px solid #ffb35c38;border-radius:12px;padding:14px 16px;margin:16px 0}
  .dossier h3{margin:0 0 4px;font-size:16px;color:#ffd7a5}
  .dossier .dsub{color:var(--dim);font-size:12.5px;margin:0 0 12px}
  .dline{font-size:14px;margin-bottom:9px}
  .dline .dq{color:var(--dim);display:block;font-size:12.5px}
  .dline .da{color:var(--text);font-weight:600}

  .navrow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px;flex-wrap:wrap}

  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:linear-gradient(180deg,#0d0b14cc,#0d0b14);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .sticky .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .track{flex:1;height:8px;border-radius:999px;background:#ffffff14;overflow:hidden}
  .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(92deg,var(--accent),var(--accent2));transition:width .35s ease}
  .live{font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;min-width:86px;text-align:right}
  .live .den{font-weight:400;color:var(--dim);font-size:13px}
  .live small{display:block;font-weight:400;font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

  /* results */
  .scorebig{
    font-size:clamp(76px,20vw,140px);font-weight:800;line-height:1;letter-spacing:-.05em;text-align:center;
    background:linear-gradient(92deg,var(--accent),var(--accent2),var(--warm));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;
  }
  .outof{display:block;text-align:center;color:var(--dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
  .tier{text-align:center;font-size:clamp(20px,5vw,30px);font-weight:700;margin:10px 0 6px}
  .tierdesc{text-align:center;color:var(--dim);max-width:520px;margin:0 auto 18px;font-size:15px}
  .cohort{text-align:center;background:#ffffff0a;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 0 14px}
  .cohort .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .cohort .big small{font-size:15px;font-weight:600;color:var(--text);-webkit-text-fill-color:var(--text);margin-left:4px}
  .cohort .l1{font-size:13px;color:var(--dim);margin-top:2px}
  .cohort .l2{font-size:11.5px;color:var(--faint);margin-top:4px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 14px}
  .stat{background:#ffffff0a;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat b i{font-style:normal;color:var(--dim);font-size:15px;font-weight:400}
  .stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px}
  .brkrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:12px;font-size:14px}
  .brkbar{grid-column:1/-1;height:7px;border-radius:999px;background:#ffffff12;overflow:hidden}
  .brkbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(92deg,var(--accent),var(--accent2))}
  .callout{background:#ffffff0a;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14.5px}
  .callout b{color:var(--accent2)}
  .foot{color:var(--faint);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
  .hidden{display:none!important}

  /* wheel */
  .wheelhead{text-align:center;margin:4px 0 12px}
  .wheelhead h2{font-size:30px;margin:0 0 4px}
  .wheelhead .m{font-size:12.5px;color:var(--dim)}
  .wheelbox{position:relative;width:min(300px,86vw);height:min(300px,86vw);margin:0 auto 18px;cursor:pointer;user-select:none}
  .wheelbox svg{width:100%;height:100%;display:block;overflow:visible}
  .wheelbox .dial{transform-origin:50% 50%;transition:transform 2.4s cubic-bezier(.16,1,.3,1)}
  .wheelbox .dial.still{transition:none}
  .wheelbox .ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:22px;height:18px;filter:drop-shadow(0 2px 3px #00000088)}
  .wheelbox .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-weight:600}
  .qcard{text-align:center}
  .qcard .sec{font-size:12.5px;color:var(--dim);font-weight:600;margin-bottom:10px}
  .qcard .q{font-size:25px;font-weight:700;line-height:1.2;margin:0 0 10px}
  .qcard .h{font-size:13px;color:var(--dim)}
  .qcard .bonus{font-size:12.5px;color:var(--warm);font-weight:600;margin-top:8px}
  .qcard.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .tapspin{text-align:center;color:var(--faint);font-size:15px;padding:26px 0}
  .ctrls{display:flex;gap:10px;margin:0 0 10px}
  .ctrls .btn{flex:1}
  .ctrlrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .players{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .player{border:1px solid var(--line);background:#ffffff0d;border-radius:11px;padding:8px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--text);transition:.12s;min-width:70px}
  .player:hover{background:#ffffff14}
  .player .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .player .f{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);letter-spacing:1px}
  .player.out{background:#ff7a9c1f;border-color:#ff7a9c73;opacity:.65}
  .player.out .f{color:var(--accent2)}
  .winner{text-align:center;color:var(--warm);font-weight:700;padding:6px 0;font-size:15px}
  .filters{text-align:center;color:var(--faint);font-size:11.5px}

  /* sheets */
  .backdrop{position:fixed;inset:0;background:#0d0b14aa;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:min(760px,100%);max-height:88vh;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:1}
  .sheet .sh b{font-size:16px}
  .sheet .card{padding:14px}
  .sheet .card h3{margin-bottom:10px}
  .addrow{display:flex;gap:8px;margin-bottom:8px}
  .addrow input{flex:1;background:#ffffff0d;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:14px}
  .addrow input:focus{outline:0;border-color:var(--accent)}
  .pchip{display:inline-flex;align-items:center;gap:6px;background:#ffffff0f;border-radius:999px;padding:5px 10px;font-size:12.5px;margin:0 6px 6px 0}
  .pchip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0}
  .secrow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:14px;user-select:none}
  .secrow .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:0 0 auto}
  .secrow.on .ck{background:var(--accent2);border-color:var(--accent2)}
  .secrow .ck svg{width:11px;height:11px;opacity:0}
  .secrow.on .ck svg{opacity:1}
  .secrow.off{color:var(--faint)}
  .secrow .cnt{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--faint)}
  .held{font-size:12.5px}
  .held .hr{display:flex;gap:9px;align-items:flex-start;padding:5px 0;color:var(--dim)}
  .held .hr.first{color:var(--text);background:#ff7a9c1a;border-radius:8px;padding:5px 8px}
  .held .hr .w{width:26px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--faint);flex:0 0 auto}
  .held .hr.first .w{color:var(--accent2)}
  .held .capline{text-align:center;color:var(--faint);font-size:10px;padding:4px 0}
  .small{font-size:11.5px;color:var(--faint);margin-top:8px}
  .hrow{display:flex;gap:10px;padding:6px 0;font-size:14px}

/* ==================================================================
   Quiz — derived lookups (Model.swift)
   ================================================================== */
const SECTIONS = BANK.sections;
const TIERS    = BANK.tiers;
const ALL      = SECTIONS.flatMap(s => s.items);
const BY_NUM   = new Map(ALL.map(q => [q.number, q]));
const SEC_OF   = new Map(); SECTIONS.forEach(s => s.items.forEach(q => SEC_OF.set(q.number, s.id)));
const SEC_BY_ID = new Map(SECTIONS.map(s => [s.id, s]));

/* The most a question could ever cost — the top of its slider, if it has one.
   Modifiers can't raise it, only discount from it, which keeps the denominator fixed. */
const maxWeight = q => q.slider ? Math.max(...q.slider.stops.map(s => s.weight)) : q.weight;
const sectionTotal = s => s.items.reduce((a, q) => a + maxWeight(q), 0);

const TOTAL_Q   = ALL.length;
const TOTAL_W   = ALL.reduce((a, q) => a + maxWeight(q), 0);
const N_SLIDERS = ALL.filter(q => q.slider).length;
const N_RECENCY = ALL.filter(q => q.recency).length;
const N_FREQ    = ALL.filter(q => q.frequency).length;
const N_CHEEKY  = ALL.filter(q => q.cheeky).length;
const AVG_W     = TOTAL_W / TOTAL_Q;

const tierFor = score => TIERS.find(t => score >= t.min) || TIERS[TIERS.length - 1];

/* ==================================================================
   Scoring (Store.swift)
   ================================================================== */
const SLIDER_DEFAULT = 1;              // severity starts on a middling notch
const modifierDefault = spec => Math.max(0, spec.stops.length - 1); // discounts must be claimed

const ScoringMode = {
  /* The one score shown and shared. The others are kept because the maths is
     the interesting part, but they're not offered in the UI: `curved` skews
     everyone low, `linear` skews high, `crazy` is a joke — and with a picker
     people settle on whichever flatters them, which makes two scores incomparable. */
  canonical: "optimised",
  k: 20,              // how hard `optimised` front-loads
  kMax: 10000, kSamples: 1024,
};

/* Age normalisation. Applied as an exponent on the weight fraction, not a divisor,
   so 0 stays 0 and 1 stays 1 — "I have done all of it" is zero at any age. */
const AGE_BASELINE = 18, AGE_SLOPE = 0.30, AGE_CAP = 1.6;
function ageFactor(age){
  if(age == null || age <= AGE_BASELINE) return 1;
  return Math.min(AGE_CAP, 1 + AGE_SLOPE * Math.log(1 + (age - AGE_BASELINE) / 10));
}

const store = {
  picked: new Set(), levels: {}, recencyLevels: {}, frequencyLevels: {}, answers: {},
  cheekyMode: false, scoringMode: ScoringMode.canonical, sectionIndex: 0, phase: "intro", age: null,
};

const S = {
  isPicked: q => store.picked.has(q.number),
  toggle(q){ store.picked.has(q.number) ? store.picked.delete(q.number) : store.picked.add(q.number); save(); },
  level: q => q.number in store.levels ? store.levels[q.number] : SLIDER_DEFAULT,
  setLevel(i, q){ store.levels[q.number] = i; save(); },
  recencyLevel: q => q.number in store.recencyLevels ? store.recencyLevels[q.number] : (q.recency ? modifierDefault(q.recency) : 0),
  setRecencyLevel(i, q){ store.recencyLevels[q.number] = i; save(); },
  frequencyLevel: q => q.number in store.frequencyLevels ? store.frequencyLevels[q.number] : (q.frequency ? modifierDefault(q.frequency) : 0),
  setFrequencyLevel(i, q){ store.frequencyLevels[q.number] = i; save(); },
  answer: q => store.answers[q.number],
  setAnswer(v, q){ if(v) store.answers[q.number] = v; else delete store.answers[q.number]; save(); },

  /* What this question currently costs: its severity, discounted by how long
     ago it happened and how often. Something you admit to always costs something. */
  weight(q){
    const base = q.slider ? q.slider.stops[Math.min(S.level(q), q.slider.stops.length - 1)].weight : q.weight;
    let v = base;
    if(q.recency && q.recency.stops.length)     v *= q.recency.stops[Math.min(S.recencyLevel(q), q.recency.stops.length - 1)].multiplier;
    if(q.frequency && q.frequency.stops.length) v *= q.frequency.stops[Math.min(S.frequencyLevel(q), q.frequency.stops.length - 1)].multiplier;
    return Math.max(1, Math.round(v));
  },
  pickedQuestions: () => ALL.filter(q => store.picked.has(q.number)),
  accumulatedWeight: () => S.pickedQuestions().reduce((a, q) => a + S.weight(q), 0),
  heaviest(){
    let best = null;
    for(const q of S.pickedQuestions()){ const w = S.weight(q); if(!best || w > best.weight) best = {question: q, weight: w}; }
    return best;
  },
  ageFactor: () => ageFactor(store.age),
  isAgeAdjusted: () => store.age != null && ageFactor(store.age) > 1,

  score: (mode = store.scoringMode, ageAdjusted = true) =>
    S.scoreWith(mode, S.accumulatedWeight(), (S.heaviest() || {weight: 0}).weight, ageAdjusted),

  scoreWith(mode, weight, worst, ageAdjusted = true){
    const raw = Math.min(1, weight / TOTAL_W);
    const f = ageFactor(store.age);
    const r = ageAdjusted && f > 1 ? Math.pow(raw, f) : raw;
    switch(mode){
      case "linear":    return Math.max(0, 100 * (1 - r));
      case "optimised": { const k = ScoringMode.k; return Math.max(0, 100 - 100 * Math.log(1 + k * r) / Math.log(1 + k)); }
      case "curved":    { const volume = Math.pow(r, 0.6), ceiling = Math.min(1, 0.9 * worst / 100); return Math.max(0, 100 * (1 - ceiling) * (1 - volume)); }
      case "crazy": {
        const n = ScoringMode.kSamples; let total = 0;
        for(let i = 0; i <= n; i++){ const k = ScoringMode.kMax * i / n; total += k < 1e-9 ? r : Math.log(1 + k * r) / Math.log(1 + k); }
        return Math.max(0, 100 - 100 * total / (n + 1));
      }
    }
    return 100;
  },
  scoreText: (mode) => S.score(mode).toFixed(1),
  rawScore: () => S.score(store.scoringMode, false),
  ageBonus: () => Math.max(0, S.score() - S.rawScore()),

  /* How many points this one answer is costing right now. */
  pointCost(q){
    if(!store.picked.has(q.number)) return 0;
    const others = S.pickedQuestions().filter(o => o.number !== q.number);
    const sum = others.reduce((a, o) => a + S.weight(o), 0);
    const worst = others.reduce((m, o) => Math.max(m, S.weight(o)), 0);
    return Math.max(0, S.scoreWith(store.scoringMode, sum, worst) - S.score());
  },
  /* What the original Rice Purity Test would have given: every question counts the same. */
  unweightedScore: () => 100 - Math.round(store.picked.size / TOTAL_Q * 100),
  averageTickWeight: () => store.picked.size ? S.accumulatedWeight() / store.picked.size : 0,
  pickedCount: s => s.items.filter(q => store.picked.has(q.number)).length,
  weightPicked: s => s.items.filter(q => store.picked.has(q.number)).reduce((a, q) => a + S.weight(q), 0),
  fraction: s => { const t = sectionTotal(s); return t ? S.weightPicked(s) / t : 0; },
  dossier: () => S.pickedQuestions().flatMap(q => q.cheeky && store.answers[q.number] ? [{question: q, prompt: q.cheeky.prompt, answer: store.answers[q.number]}] : []),

  startQuiz(){ store.phase = "quiz"; store.sectionIndex = 0; render(); },
  next(){ if(store.sectionIndex < SECTIONS.length - 1) store.sectionIndex++; else store.phase = "results"; save(); render(); },
  back(){ if(store.sectionIndex > 0) store.sectionIndex--; save(); render(); },
  jump(i){ store.sectionIndex = i; save(); render(); },
  reviewAnswers(){ store.phase = "quiz"; store.sectionIndex = SECTIONS.length - 1; save(); render(); },
  reset(){ store.picked = new Set(); store.levels = {}; store.answers = {}; store.sectionIndex = 0; store.phase = "intro"; save(); render(); },
};

/* ==================================================================
   PurityNorms — where you land against people your age.
   Modelled on published averages for the *original* test, so it is
   compared against unweightedScore (the only measure data exists for).
   ================================================================== */
const PurityNorms = {
  band(age){
    if(age == null) return {label: "everyone", mean: 64, sd: 14};
    if(age < 18)  return {label: "16–17 year olds", mean: 84, sd: 11};
    if(age <= 19) return {label: "18–19 year olds", mean: 69, sd: 13};
    if(age <= 22) return {label: "20–22 year olds", mean: 60, sd: 14};
    if(age <= 29) return {label: "23–29 year olds", mean: 52, sd: 16};
    if(age <= 39) return {label: "30-somethings",   mean: 48, sd: 17};
    return {label: "40-and-overs", mean: 42, sd: 17};
  },
  /* A lower purity score means more experience, so the people you've out-done
     are the ones scoring above you — hence 1 − Φ(z). */
  fractionMoreExperienced(unweighted, age){
    const b = PurityNorms.band(age);
    const z = (unweighted - b.mean) / b.sd;
    return Math.min(1, Math.max(0, 1 - PurityNorms.normalCDF(z)));
  },
  percentile(unweighted, age){
    const raw = PurityNorms.fractionMoreExperienced(unweighted, age) * 100;
    return Math.min(99, Math.max(1, Math.round(raw)));
  },
  normalCDF: z => 0.5 * (1 + erf(z / Math.SQRT2)),
};
/* Abramowitz & Stegun 7.1.26 — max error 1.5e-7, far below anything a rounded percentile can see. */
function erf(x){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return sign * y;
}

const KEY = "freak.progress.v1";
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      picked: [...store.picked], levels: store.levels, answers: store.answers, cheekyMode: store.cheekyMode,
      sectionIndex: store.sectionIndex, scoringMode: store.scoringMode, age: store.age,
      recencyLevels: store.recencyLevels, frequencyLevels: store.frequencyLevels,
    }));
  }catch(e){}
}
function load(){
  try{
    const snap = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!snap) return;
    store.picked = new Set(snap.picked || []);
    store.levels = snap.levels || {};
    store.recencyLevels = snap.recencyLevels || {};
    store.frequencyLevels = snap.frequencyLevels || {};
    store.answers = snap.answers || {};
    store.cheekyMode = !!snap.cheekyMode;
    store.age = typeof snap.age === "number" ? snap.age : null;
    store.sectionIndex = Math.min(snap.sectionIndex || 0, SECTIONS.length - 1);
    // The persisted mode is deliberately ignored: a run saved under `curved`
    // must not come back wearing a number nobody can compare.
    store.scoringMode = ScoringMode.canonical;
  }catch(e){}
}

/* ==================================================================
   Wheel — party mode (WheelGame.swift). Entirely separate state.
   ================================================================== */
const PromptStyle = {
  neverHaveIEver: "Never have I ever",
  putAFingerDown: "Put a finger down",
};
/* Longest forms first — "yours" before "your" before "you". Both apostrophes appear in the bank. */
const FIRST_PERSON = [
  [/\byourselves\b/gi, "ourselves"], [/\byourself\b/gi, "myself"],
  [/\byou['’]d\b/gi, "I'd"], [/\byou['’]ve\b/gi, "I've"], [/\byou['’]re\b/gi, "I'm"], [/\byou['’]ll\b/gi, "I'll"],
  [/\byours\b/gi, "mine"], [/\byour\b/gi, "my"], [/\byou\b/gi, "I"],
];
function phrase(style, text){
  if(!text) return text;
  const rest = text.slice(1);
  const startsWithAcronym = rest[0] && rest[0] === rest[0].toUpperCase() && rest[0] !== rest[0].toLowerCase();
  const body = startsWithAcronym ? text : text[0].toLowerCase() + rest;
  if(style === "neverHaveIEver") return "Never have I ever " + FIRST_PERSON.reduce((t, [re, rep]) => t.replace(re, rep), body);
  return "Put a finger down if you've " + body;
}

const game = {
  excludedSections: new Set(), maxWeight: 100, promptStyle: "neverHaveIEver", autoRetire: true,
  players: [], retired: new Set(), currentNumber: null, history: [], rotation: 0, spinning: false,
};
const MAX_PLAYERS = 25;
const G = {
  current: () => game.currentNumber != null ? BY_NUM.get(game.currentNumber) : null,
  isEligible: q => !game.retired.has(q.number) && q.weight <= game.maxWeight && !game.excludedSections.has(SEC_OF.get(q.number)),
  pool: () => ALL.filter(G.isEligible),
  poolBySection(){
    const counts = new Map();
    for(const q of G.pool()){ const id = SEC_OF.get(q.number); counts.set(id, (counts.get(id) || 0) + 1); }
    return SECTIONS.flatMap(s => counts.get(s.id) ? [{section: s, count: counts.get(s.id)}] : []);
  },
  isExhausted: () => G.pool().length === 0,
  /* What the cap is holding back, lightest first, so the top row is the one
     just over the line. Switched-off sections are left out. */
  heldBackBySpiceCap: () => ALL.filter(q => q.weight > game.maxWeight && !game.excludedSections.has(SEC_OF.get(q.number))).sort((a, b) => a.weight - b.weight),
  /* Uniform across the pool — not "pick a slice, then pick within it", which would favour small sections. */
  drawNext(){
    const pool = G.pool(); if(!pool.length) return null;
    const q = pool[Math.floor(Math.random() * pool.length)];
    const id = SEC_OF.get(q.number);
    const index = Math.max(0, G.poolBySection().findIndex(s => s.section.id === id));
    return {question: q, sectionIndex: index};
  },
  commit(q){
    if(game.currentNumber != null && game.autoRetire) game.retired.add(game.currentNumber);
    game.currentNumber = q.number; game.history.unshift(q.number); saveGame();
  },
  retireCurrent(){ if(game.currentNumber == null) return; game.retired.add(game.currentNumber); game.currentNumber = null; saveGame(); },
  resetQuestions(){ game.retired = new Set(); game.currentNumber = null; game.history = []; saveGame(); },
  addPlayer(name){
    const t = name.trim(); if(!t || game.players.length >= MAX_PLAYERS) return;
    game.players.push({id: Math.random().toString(36).slice(2), name: t, fingersLeft: 10}); saveGame();
  },
  removePlayer: p => { game.players = game.players.filter(x => x.id !== p.id); saveGame(); },
  putFingerDown: p => { p.fingersLeft = Math.max(0, p.fingersLeft - 1); saveGame(); },
  restoreFinger: p => { p.fingersLeft = Math.min(10, p.fingersLeft + 1); saveGame(); },
  resetFingers(){ game.players.forEach(p => p.fingersLeft = 10); saveGame(); },
  survivors: () => game.players.filter(p => p.fingersLeft > 0),
  winner(){ const s = G.survivors(); return game.players.length > 1 && s.length === 1 ? s[0] : null; },
};
const GKEY = "freak.wheel.v1";
function saveGame(){
  try{ localStorage.setItem(GKEY, JSON.stringify({
    excludedSections: [...game.excludedSections], maxWeight: game.maxWeight, promptStyle: game.promptStyle,
    autoRetire: game.autoRetire, players: game.players, retired: [...game.retired], history: game.history })); }catch(e){}
}
function loadGame(){
  try{
    const s = JSON.parse(localStorage.getItem(GKEY) || "null"); if(!s) return;
    game.excludedSections = new Set(s.excludedSections || []);
    game.maxWeight = typeof s.maxWeight === "number" ? s.maxWeight : 100;
    game.promptStyle = s.promptStyle in PromptStyle ? s.promptStyle : "neverHaveIEver";
    game.autoRetire = s.autoRetire !== false;
    game.players = Array.isArray(s.players) ? s.players : [];
    game.retired = new Set(s.retired || []);
    game.history = Array.isArray(s.history) ? s.history : [];
    game.currentNumber = null; // nobody heard the last one read out
  }catch(e){}
}

/* The bank uses **bold** and *italics* in a handful of places. Escape first, then mark up. */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");
const plain = s => String(s).replace(/\*/g, "");
/* 1st, 2nd, 3rd, 4th … 11th, 12th, 13th … 21st. */
const ordinal = n => { const m = n % 100; return n + (m >= 11 && m <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); };
const TICK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#1a0f1f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    app.innerHTML = `<div class="seg" id="modeSeg"><button data-m="quiz" class="${mode === "quiz" ? "on" : ""}">Quiz</button><button data-m="wheel" class="${mode === "wheel" ? "on" : ""}">Wheel</button></div>`

    app.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { mode = b.dataset.m; try{ localStorage.setItem("freak.mode", mode); }catch(e){} render(); });
    if(mode === "quiz") wireIntro(); else wireWheel();
    if(openSheet) renderSheet();
  }
  window.scrollTo({top: 0, behavior: "smooth"});
}

function renderModifier(kind, spec, level){
  const stop = spec.stops[Math.min(level, spec.stops.length - 1)];
  const disc = Math.round((1 - stop.multiplier) * 100);
  return `<div class="scaler mod" data-kind="${kind}">
    <div class="sq">${esc(spec.prompt)}</div>
    <input type="range" class="purple" min="0" max="${spec.stops.length - 1}" step="1" value="${level}">
    <div class="slabel"><span class="l">${esc(stop.label)}</span><span class="w ${disc > 0 ? "disc" : "full"}">${disc > 0 ? "−" + disc + "%" : "full weight"}</span></div>
  </div>`;
}
function renderQuestion(q){
  const on = S.isPicked(q), lvl = S.level(q);
  const ch = store.cheekyMode ? q.cheeky : null;
  const ans = S.answer(q) || "";
  const custom = ch && ans && !ch.options.includes(ans) ? ans : "";
  return `<li class="item ${on ? "on" : ""}" data-n="${q.number}">
    <div class="row">

      <div class="ends"><span>${esc(q.slider.stops[0].label)}</span><span>${esc(q.slider.stops[q.slider.stops.length - 1].label)}</span></div>
    </div>` : ""}
    <div class="mods ${on ? "" : "hidden"}">

function wireQuiz(){
  $("menuBtn").onclick = e => { e.stopPropagation(); menuOpen = !menuOpen; $("menuPop").classList.toggle("hidden", !menuOpen); };
  document.body.onclick = () => { if(menuOpen){ menuOpen = false; const p = $("menuPop"); if(p) p.classList.add("hidden"); } };
  $("mCheeky").onclick = () => { store.cheekyMode = !store.cheekyMode; save(); menuOpen = false; render(); };
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { menuOpen = false; S.jump(+b.dataset.jump); });
  $("prev").onclick = () => S.back();
  $("next").onclick = () => S.next();

  document.querySelectorAll("li.item").forEach(li => {
    const q = BY_NUM.get(+li.dataset.n);
    const sev = li.querySelector(".scaler.sev"), mods = li.querySelector(".mods"), cheekyBox = li.querySelector(".cheeky");
    const refreshWeight = () => { li.querySelector("[data-wt]").textContent = S.weight(q); updateBar(); };

    li.querySelector(".row").onclick = () => {
      S.toggle(q); const on = S.isPicked(q);
      li.classList.toggle("on", on);
      if(sev) sev.classList.toggle("hidden", !on);
      mods.classList.toggle("hidden", !on);
      if(cheekyBox) cheekyBox.classList.toggle("hidden", !on);
      updateBar();
    };

    const hintBtn = li.querySelector(".hint"), hintBox = li.querySelector(".hintbox");
    if(hintBtn){
      hintBtn.onmouseenter = () => hintBox.classList.remove("hidden");
      hintBtn.onmouseleave = () => { if(!hintBtn.classList.contains("pinned")) hintBox.classList.add("hidden"); };
      hintBtn.onclick = e => { e.stopPropagation(); const pin = hintBtn.classList.toggle("pinned"); hintBox.classList.toggle("hidden", !pin); };
    }

    if(sev){
      const r = sev.querySelector("input");
      r.onclick = e => e.stopPropagation();
      r.oninput = () => {
        const lvl = +r.value; S.setLevel(lvl, q);
        sev.querySelector(".slabel .l").textContent = q.slider.stops[lvl].label;
        sev.querySelector(".slabel .w").textContent = "weight " + q.slider.stops[lvl].weight;
        refreshWeight();
      };
    }
    mods.querySelectorAll(".scaler.mod").forEach(m => {
      const kind = m.dataset.kind, spec = q[kind], r = m.querySelector("input");
      r.onclick = e => e.stopPropagation();
      r.oninput = () => {
        const lvl = +r.value; (kind === "recency" ? S.setRecencyLevel : S.setFrequencyLevel)(lvl, q);
        const stop = spec.stops[lvl], disc = Math.round((1 - stop.multiplier) * 100);
        m.querySelector(".slabel .l").textContent = stop.label;
        const w = m.querySelector(".slabel .w"); w.textContent = disc > 0 ? "−" + disc + "%" : "full weight";
        w.className = "w " + (disc > 0 ? "disc" : "full");
        refreshWeight();
      };
    });

    if(cheekyBox){
      cheekyBox.onclick = e => e.stopPropagation();
      const input = cheekyBox.querySelector(".cinput");
      cheekyBox.querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
        const opt = chip.dataset.opt, off = S.answer(q) === opt;
        cheekyBox.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
        if(off) S.setAnswer(null, q); else { S.setAnswer(opt, q); chip.classList.add("sel"); input.value = ""; }
      });
      input.oninput = () => {
        const v = input.value.trim();
        cheekyBox.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
        if(v) S.setAnswer(v, q);
        else if(S.answer(q) && !q.cheeky.options.includes(S.answer(q))) S.setAnswer(null, q);
      };
    }
  });
}
function updateBar(){
  $("liveScore").textContent = S.scoreText();
  $("fill").style.width = ((store.sectionIndex + 1) / SECTIONS.length * 100) + "%";
}

  const rows = SECTIONS.map(s => ({s, cnt: S.pickedCount(s), pct: S.fraction(s)}));
  const sorted = [...rows].sort((a, b) => b.pct - a.pct), loud = sorted[0], quiet = sorted[sorted.length - 1];
  const dossier = S.dossier();
  const originalTail = score > old ? `Weighting lifts that to <b>${score.toFixed(1)}</b>: you ticked plenty of boxes, but they're cheap ones.`
    : score < old ? `Weighting drags that to <b>${score.toFixed(1)}</b>: counting boxes can't tell a hickey from a hit-and-run.`
    : `Weighting lands you in exactly the same place, which is a statistically boring outcome.`;

  if(heaviest){

      ? `On its own it caps you at <b>${Math.round(100 * (1 - Math.min(1, 0.9 * heaviest.weight / 100)))}</b>, before anything else you admitted to is counted.`

  return `
    <div class="topbar"><span class="t">Your score</span></div>
    <div class="card">
      <div class="scorebig">${score.toFixed(1)}</div>

      <p class="tierdesc">${esc(tier.blurb)}</p>

      <div class="cohort">
        <div class="big"><span class="grad">${pct}</span><small>${ordinal(pct).slice(String(pct).length)} percentile</small></div>
        <div class="l1">You've done more than about ${pct}% of ${band.label}.</div>
        <div class="l2">${store.age == null ? "Estimated against everyone. Add your age on the intro screen for a closer comparison." : "Estimated from published Rice Purity averages, matched on your unweighted score. Self-reported data, so treat it as a ballpark."}</div>
      </div>

      <div class="statgrid">
        <div class="stat"><b>${store.picked.size} <i>of ${TOTAL_Q}</i></b><span>items ticked</span></div>
        <div class="stat"><b>${nf(S.accumulatedWeight())} <i>of ${nf(TOTAL_W)}</i></b><span>weight carried</span></div>
        <div class="stat"><b>${S.averageTickWeight().toFixed(1)} <i>vs ${AVG_W.toFixed(1)}</i></b><span>your avg tick vs the test's</span></div>
      </div>

      ${S.isAgeAdjusted() ? `<div class="callout">Graded for <b>${store.age}</b> — you've had ${store.age - AGE_BASELINE} more years than an 18-year-old to accumulate this stuff, so the curve is bent in your favour. Without it you'd be on <b>${S.rawScore().toFixed(1)}</b>, which makes the allowance worth <b>${S.ageBonus().toFixed(1)} points</b>.</div>` : ""}

      ${heaviest ? `<div class="callout">Heaviest single thing you ticked: <b>Q${heaviest.question.number} — ${esc(plain(heaviest.question.text))}</b>, weight ${heaviest.weight} out of 100. ${heaviestTail}</div>` : ""}

      <div class="callout">On the original Rice Purity Test — where every question counts exactly the same — you'd have scored <b>${old}/100</b>. ${originalTail}</div>

      ${dossier.length ? `<div class="dossier">
        <h3>The cheeky dossier 😏</h3>
        <p class="dsub">${dossier.length} thing${dossier.length === 1 ? "" : "s"} you volunteered that nobody asked you to. None of it counted toward the score.</p>
        ${dossier.map(d => `<div class="dline"><span class="dq">Q${d.question.number} · ${esc(d.prompt)}</span><span class="da">${esc(d.answer)}</span></div>`).join("")}

      ${rows.map(r => `<div class="brkrow">

      <div class="callout">Your loudest section is <b>${esc(loud.s.title)}</b> at ${Math.round(loud.pct * 100)}%. Your quietest is <b>${esc(quiet.s.title)}</b> at ${Math.round(quiet.pct * 100)}%.</div>

      <div class="navrow" style="margin-top:12px">
        <button class="btn ghost" id="back">← Review answers</button>
        <button class="btn ghost" id="copy">Copy result</button>

function wireResults(){
  $("back").onclick = () => S.reviewAnswers();
  $("reset").onclick = () => S.reset();

    const score = S.score(), tier = tierFor(score);
    const loud = [...SECTIONS].sort((a, b) => S.fraction(b) - S.fraction(a))[0];

  g.font = "500 44px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#a79cbd"; g.fillText("/100", 540, 540);
  g.font = "800 60px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#efeaf7"; g.fillText(tier.title, 540, 640);
  if(h){
    g.font = "700 24px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#a79cbd"; g.fillText("WORST THING I TICKED", 540, 745);
    g.font = "600 34px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#efeaf7";
    wrapText(g, `Q${h.question.number} — ${plain(h.question.text)}`, 540, 800, 900, 44);
    g.font = "500 28px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#ff7a9c"; g.fillText(`weight ${h.weight} out of 100`, 540, 930);
  } else {
    g.font = "600 34px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#efeaf7"; g.fillText("Ticked absolutely nothing. Suspicious.", 540, 800);
  }
  g.font = "500 26px ui-sans-serif, -apple-system, Helvetica, Arial"; g.fillStyle = "#6f6486"; g.fillText("weighted, so a felony ≠ a kiss", 540, 1010);

  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], `freaky-score-${Math.round(score)}.png`, {type: "image/png"});
  const text = `My freaky score: ${score.toFixed(1)}/100`;
  if(navigator.canShare && navigator.canShare({files: [file]})){
    try{ await navigator.share({files: [file], title: text, text}); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function wrapText(g, text, x, y, maxW, lh){
  const words = text.split(" "); let line = "", lines = [];
  for(const w of words){ const t = line ? line + " " + w : w; if(g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if(line) lines.push(line);
  lines.slice(0, 3).forEach((l, i) => g.fillText(l, x, y + i * lh));
}

/* ==================================================================
   WHEEL (WheelView.swift)
   ================================================================== */
/* One colour per section, evenly spaced around the hue circle and tinted toward purple/pink. */
function sliceColour(i, n){
  const hue = ((0.78 + i / Math.max(n, 1) * 0.55) % 1) * 360, sat = 0.55, val = 0.78;
  const l = val * (1 - sat / 2), s = l === 0 || l === 1 ? 0 : (val - l) / Math.min(l, 1 - l);
  return `hsl(${hue.toFixed(1)} ${(s * 100).toFixed(1)}% ${(l * 100).toFixed(1)}%)`;
}
function wheelSVG(slices){
  const R = 150, cx = 150, cy = 150, total = Math.max(1, slices.reduce((a, s) => a + s.count, 0));
  let start = -90, paths = "", labels = "";
  slices.forEach((sl, i) => {
    const sweep = 360 * sl.count / total, end = start + sweep;
    const a0 = start * Math.PI / 180, a1 = end * Math.PI / 180;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const large = sweep > 180 ? 1 : 0;
    paths += slices.length === 1
      ? `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${sliceColour(i, slices.length)}"/>`
      : `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${sliceColour(i, slices.length)}" stroke="#0d0b1499" stroke-width="1.5"/>`;
    const mid = (start + sweep / 2) * Math.PI / 180;
    labels += `<text x="${(cx + Math.cos(mid) * R * 0.66).toFixed(2)}" y="${(cy + Math.sin(mid) * R * 0.66).toFixed(2)}" font-size="19" text-anchor="middle" dominant-baseline="central">${sl.section.emoji}</text>`;
    start = end;
  });
  return `<svg viewBox="0 0 300 300"><g class="dial still" id="dial" style="transform:rotate(${game.rotation}deg)">${paths}${labels}<circle cx="${cx}" cy="${cy}" r="${R * 0.17}" fill="#0d0b14" stroke="#332a47"/></g><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#332a47" stroke-width="2"/></svg>
    <svg class="ptr" viewBox="0 0 22 18"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#c86dd7"/><stop offset="1" stop-color="#ff7a9c"/></linearGradient></defs><path d="M11,18 L0,0 L22,0 Z" fill="url(#pg)"/></svg>`;
}
function renderWheel(){
  const slices = G.poolBySection(), pool = G.pool(), cur = G.current();
  let qcard;
  if(cur){
    const sec = SEC_BY_ID.get(SEC_OF.get(cur.number));
    qcard = `<div class="card qcard pop"><div class="sec">${sec.emoji}&nbsp; ${esc(sec.title)}</div><div class="q">${esc(phrase(game.promptStyle, plain(cur.text)))}</div>
      ${cur.hint ? `<div class="h">${md(cur.hint)}</div>` : ""}${cur.cheeky ? `<div class="bonus">Bonus: ${esc(cur.cheeky.prompt)}</div>` : ""}</div>`;
  } else if(G.isExhausted()){
    qcard = `<div class="card qcard"><div style="font-size:40px">🎉</div><div class="q" style="font-size:17px">You've been through everything that's left.</div><div class="h">Reset the wheel, or loosen the filters.</div></div>`;
  } else qcard = `<div class="tapspin">Tap the wheel to spin</div>`;
  const winner = G.winner(), ex = game.excludedSections.size;
  return `
    <div class="wheelhead"><h2 class="grad">${PromptStyle[game.promptStyle]}</h2><div class="m">${pool.length} left on the wheel · ${game.history.length} asked</div></div>
    <div class="wheelbox" id="wheelBox" role="button" aria-label="Spin the wheel. ${pool.length} questions left.">${wheelSVG(slices)}${slices.length ? "" : `<div class="empty">Nothing left</div>`}</div>
    ${qcard}
    <button class="btn wide" id="spin" ${G.isExhausted() || game.spinning ? "disabled" : ""}>${cur ? "Spin again" : "Spin"}</button>
    <div class="ctrls" style="margin-top:10px"><button class="btn quiet sm" id="retire" ${cur ? "" : "disabled"}>🗑 Retire this one</button><button class="btn quiet sm" id="resetWheel">↺ Reset wheel</button></div>
    <div class="ctrlrow"><button class="linkbtn" id="openSetup">⚙︎ Players &amp; filters</button><button class="linkbtn" id="openHistory" ${game.history.length ? "" : "disabled"}>🕓 Asked (${game.history.length})</button></div>
    ${game.players.length ? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">Fingers</b><button class="linkbtn" id="resetFingers">Reset fingers</button></div>
      ${winner ? `<div class="winner">👑 ${esc(winner.name)} survives.</div>` : ""}
      <div class="players">${game.players.map(p => `<button class="player ${p.fingersLeft <= 0 ? "out" : ""}" data-p="${p.id}"><div class="n">${esc(p.name)}</div><div class="f">${p.fingersLeft <= 0 ? "out" : "•".repeat(p.fingersLeft)}</div></button>`).join("")}</div>
      <div class="small">Tap a name when they put a finger down. Right-click (or long-press) to undo.</div>
    </div>` : ""}
    <div class="filters">${ex === 0 ? `All sections in play · nothing above weight ${game.maxWeight}` : `${ex} section${ex === 1 ? "" : "s"} off · nothing above weight ${game.maxWeight}`}</div>`;
}
function wireWheel(){
  $("wheelBox").onclick = spin; $("spin").onclick = spin;
  $("retire").onclick = () => { G.retireCurrent(); render(); };
  $("resetWheel").onclick = () => { G.resetQuestions(); render(); };
  $("openSetup").onclick = () => { openSheet = "setup"; renderSheet(); };
  $("openHistory").onclick = () => { openSheet = "history"; renderSheet(); };
  const rf = $("resetFingers"); if(rf) rf.onclick = () => { G.resetFingers(); render(); };
  document.querySelectorAll(".player").forEach(b => {
    const p = game.players.find(x => x.id === b.dataset.p);
    let timer;
    b.onclick = () => { G.putFingerDown(p); render(); };
    b.oncontextmenu = e => { e.preventDefault(); G.restoreFinger(p); render(); };
    b.ontouchstart = () => { timer = setTimeout(() => { timer = null; G.restoreFinger(p); render(); }, 550); };
    b.ontouchend = b.ontouchmove = () => { if(timer){ clearTimeout(timer); } };
  });
}
function spin(){
  if(game.spinning) return;
  const draw = G.drawNext(); if(!draw) return;
  const slices = G.poolBySection(), total = Math.max(1, slices.reduce((a, s) => a + s.count, 0));
  // Land the pointer inside the drawn question's own slice, so the animation tells the truth.
  let startAngle = 0;
  for(let i = 0; i < slices.length; i++){ if(i === draw.sectionIndex) break; startAngle += 360 * slices[i].count / total; }
  const sweep = 360 * slices[Math.min(draw.sectionIndex, slices.length - 1)].count / total;
  const target = startAngle + (0.15 + Math.random() * 0.7) * sweep;
  // Pointer sits at 12 o'clock, so the wheel rotates by −target for that angle to end up under it.
  const current = game.rotation;
  let delta = (-target - current) % 360; if(delta < 0) delta += 360;
  const spins = (3 + Math.floor(Math.random() * 3)) * 360;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, duration = reduce ? 10 : 2400;
  game.spinning = true; game.rotation = current + spins + delta;
  const dial = $("dial"); $("spin").disabled = true;
  dial.classList.remove("still"); if(reduce) dial.style.transitionDuration = "10ms";
  requestAnimationFrame(() => { dial.style.transform = `rotate(${game.rotation}deg)`; });
  if(navigator.vibrate) navigator.vibrate(12);
  setTimeout(() => { G.commit(draw.question); game.spinning = false; render(); if(navigator.vibrate) navigator.vibrate([10, 30, 10]); }, duration);
}

/* Setup & history sheets */
function renderSheet(){
  document.querySelectorAll(".backdrop").forEach(b => b.remove());
  if(!openSheet) return;
  const wrap = document.createElement("div"); wrap.className = "backdrop";
  wrap.onclick = e => { if(e.target === wrap){ openSheet = null; render(); } };
  let body;
  if(openSheet === "history"){
    body = `<div class="sh"><b>Asked tonight</b><button class="closex" id="closeSheet">✕</button></div>
      ${game.history.map((n, i) => { const q = BY_NUM.get(n); return q ? `<div class="hrow"><span class="i">${game.history.length - i}</span><span>${esc(phrase(game.promptStyle, plain(q.text)))}</span></div>` : ""; }).join("")}`;
  } else {
    const held = G.heldBackBySpiceCap();
    body = `<div class="sh"><b>Set up the game</b><button class="closex" id="closeSheet">✕</button></div>
      <div class="card"><h3>Players</h3>
        <div class="addrow"><input id="newPlayer" placeholder="Add a name" maxlength="24"><button class="btn sm" id="addPlayer">Add</button></div>
        ${game.players.length ? `<div>${game.players.map(p => `<span class="pchip">${esc(p.name)}<button data-rm="${p.id}" title="Remove">✕</button></span>`).join("")}</div>` : `<div class="small" style="margin-top:0">Optional — the wheel works fine without scorekeeping.</div>`}
      </div>
      <div class="card"><h3>How it reads</h3>
        <div class="seg" id="styleSeg">${Object.entries(PromptStyle).map(([k, v]) => `<button data-s="${k}" class="${game.promptStyle === k ? "on" : ""}">${v}</button>`).join("")}</div>
        <div class="toggle pink ${game.autoRetire ? "on" : ""}" id="autoRetire" style="margin:0"><div class="sw"><i></i></div><div class="tl" style="font-size:14px">Retire questions once asked</div></div>
      </div>
      <div class="card"><div class="spicehead"><h3>Spice cap</h3><span class="v" id="spiceV">weight ≤ ${game.maxWeight}</span></div>
        <input type="range" id="spice" min="10" max="100" step="5" value="${game.maxWeight}">
        <div class="small" id="spiceNote">The quiz's own severity numbers, reused as a dial. At 30 you'll get kisses and fake IDs; at 100 anything on the list can come up. ${G.pool().length} questions currently in play.</div>
      </div>
      <div class="card"><h3>Sections</h3>
        ${SECTIONS.map(s => { const on = !game.excludedSections.has(s.id); return `<div class="secrow ${on ? "on" : "off"}" data-sec="${s.id}"><span class="ck">${TICKW}</span><span>${s.emoji}&nbsp; ${esc(s.title)}</span><span class="cnt">${s.items.length}</span></div>`; }).join("")}
        <div class="small">Switch off anything the group would rather not have come up.</div>
      </div>
      <div class="card held"><div class="spicehead"><h3>Held back by the cap</h3><span class="v">${held.length}</span></div>
        ${held.length === 0 ? `<div class="small" style="margin-top:0">Nothing — every question in your chosen sections is in play.</div>`
          : `<div class="small" style="margin:0 0 8px">Lightest first. The top one is what you'd get back by nudging the cap up — if it looks tame, you've set it too low.</div>
             ${held.map((q, i) => `<div class="hr ${i === 0 ? "first" : ""}"><span class="w">${q.weight}</span><span>${SEC_BY_ID.get(SEC_OF.get(q.number)).emoji}</span><span>${esc(plain(q.text))}</span></div>${i === 0 && held.length > 1 ? `<div class="capline">— cap is here —</div>` : ""}`).join("")}`}
      </div>`;
  }
  wrap.innerHTML = `<div class="sheet">${body}</div>`;
  document.body.appendChild(wrap);
  $("closeSheet").onclick = () => { openSheet = null; render(); };
  if(openSheet !== "setup") return;
  const add = () => { G.addPlayer($("newPlayer").value); renderSheet(); const i = $("newPlayer"); if(i) i.focus(); };
  $("addPlayer").onclick = add; $("newPlayer").onkeydown = e => { if(e.key === "Enter") add(); };
  wrap.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { G.removePlayer({id: b.dataset.rm}); renderSheet(); });
  wrap.querySelectorAll("#styleSeg button").forEach(b => b.onclick = () => { game.promptStyle = b.dataset.s; saveGame(); renderSheet(); });
  $("autoRetire").onclick = () => { game.autoRetire = !game.autoRetire; saveGame(); renderSheet(); };
  $("spice").oninput = () => {
    game.maxWeight = +$("spice").value; saveGame();
    $("spiceV").textContent = `weight ≤ ${game.maxWeight}`;
    $("spiceNote").textContent = `The quiz's own severity numbers, reused as a dial. At 30 you'll get kisses and fake IDs; at 100 anything on the list can come up. ${G.pool().length} questions currently in play.`;
  };
  $("spice").onchange = () => renderSheet();
  wrap.querySelectorAll("[data-sec]").forEach(r => r.onclick = () => {
    const id = r.dataset.sec; game.excludedSections.has(id) ? game.excludedSections.delete(id) : game.excludedSections.add(id); saveGame(); renderSheet();
  });
}
